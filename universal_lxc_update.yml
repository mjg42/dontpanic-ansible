---
- name: Universal Parallel Updater
  hosts: all
  gather_facts: false
  tasks:
    - name: Run silent community script update command
      ansible.builtin.shell: update
      environment:
        TERM: xterm-256color
        PHS_SILENT: "1"
      register: container_update_output
      ignore_unreachable: true
      # 🌟 THE TAG FILTER: Only run if the host has this exact variable set
      when: update_style | default('') == 'script'

    - name: Stream upgrade summary back to Semaphore console
      ansible.builtin.debug:
        var: container_update_output.stdout_lines
      when: update_style | default('') == 'script' and container_update_output.stdout_lines is defined
